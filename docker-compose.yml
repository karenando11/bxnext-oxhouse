# Everything for local work:   docker compose up --build        (or: make docker-up)
#   db       PostgreSQL 16 on localhost:5432
#   backend  the Django app on http://localhost:8000, with the source mounted so edits reload
#
# The backend container ALWAYS talks to the db container, whatever backend/.env says, and always
# runs with the development secret key, so production credentials in backend/.env are never used
# here. Only the other values in backend/.env (for example FINVIZ_AUTH_TOKEN) are passed through.
#
# To try the production image:   docker compose --profile prod up --build backend-prod
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: oxhouse
      POSTGRES_PASSWORD: oxhouse
      POSTGRES_DB: oxhouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxhouse -d oxhouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A `frontend` service will be added here beside it when the React app arrives.
  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - path: backend/.env
        required: false
    environment: &backend-environment
      DATABASE_URL: postgres://oxhouse:oxhouse@db:5432/oxhouse
      DATABASE_DIRECT_URL: ""
      DJANGO_SECRET_KEY: local-development-secret-key-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      RAW_STORAGE_DIR: /data/raw
      # The db container is a throwaway local database, so tests and loaders may use it.
      OXHOUSE_LOCAL_DB_HOSTS: db
    volumes:
      - ./backend:/app
      - rawdata:/data/raw
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The production image: code baked in, gunicorn, debug off. For checking the image builds and
  # starts; cookies are marked secure there, so sign-in needs HTTPS.
  backend-prod:
    profiles: ["prod"]
    build:
      context: ./backend
      target: prod
    env_file:
      - path: backend/.env
        required: false
    environment:
      <<: *backend-environment
      DJANGO_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

volumes:
  pgdata:
  rawdata:
