name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per component. A `frontend` job will be added beside `backend` when the React app
# arrives. Branch protection should require each job by name.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oxhouse
          POSTGRES_PASSWORD: oxhouse
          POSTGRES_DB: oxhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxhouse -d oxhouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_URL: postgres://oxhouse:oxhouse@localhost:5432/oxhouse

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Django system checks
        run: uv run python manage.py check

      - name: Models match migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply migrations to an empty database
        run: uv run python manage.py migrate --noinput

      - name: Tests
        run: uv run pytest
